spring:
  main:
    banner-mode: off

logging:
  level:
    com.darshan.ledger: DEBUG

app:
  scheduling:
    enabled: false
  ledger:
    lock-timeout: 2s
  security:
    jwt:
      allow-generated-keys: true
    rate-limit:
      transfers-per-minute: 10000
  notification:
    retry-backoff: 100ms
