spring:
  application:
    name: core-banking-ledger
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5433/ledger}
    username: ${DB_USERNAME:ledger}
    password: ${DB_PASSWORD:ledger}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9094}
    producer:
      acks: all
      properties:
        enable.idempotence: true
        max.block.ms: 5000
        request.timeout.ms: 5000
        delivery.timeout.ms: 10000
    consumer:
      auto-offset-reset: earliest
      enable-auto-commit: false
    listener:
      ack-mode: record

server:
  port: ${SERVER_PORT:8082}

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus

logging:
  pattern:
    correlation: "[%X{correlationId:-}] "

app:
  scheduling:
    enabled: ${APP_SCHEDULING_ENABLED:true}
  account:
    branch-code: ${APP_ACCOUNT_BRANCH_CODE:0001}
    default-currency: ${APP_ACCOUNT_DEFAULT_CURRENCY:INR}
  ledger:
    lock-timeout: ${APP_LEDGER_LOCK_TIMEOUT:3s}
    eod-check-cron: ${APP_LEDGER_EOD_CHECK_CRON:0 0 1 * * *}
  idempotency:
    in-progress-timeout: ${APP_IDEMPOTENCY_IN_PROGRESS_TIMEOUT:2m}
  limits:
    per-transaction: ${APP_LIMITS_PER_TRANSACTION:500000.00}
    daily: ${APP_LIMITS_DAILY:2000000.00}
  approval:
    threshold: ${APP_APPROVAL_THRESHOLD:200000.00}
    pending-expiry: ${APP_APPROVAL_PENDING_EXPIRY:24h}
    expiry-cron: ${APP_APPROVAL_EXPIRY_CRON:0 * * * * *}
  statement:
    max-period: ${APP_STATEMENT_MAX_PERIOD:1y}
  outbox:
    relay-delay: ${APP_OUTBOX_RELAY_DELAY:PT1S}
    batch-size: ${APP_OUTBOX_BATCH_SIZE:100}
    publish-timeout: ${APP_OUTBOX_PUBLISH_TIMEOUT:15s}
    topic-partitions: ${APP_OUTBOX_TOPIC_PARTITIONS:3}
    topic-replication-factor: ${APP_OUTBOX_TOPIC_REPLICATION_FACTOR:1}
  notification:
    group-id: ${APP_NOTIFICATION_GROUP_ID:ledger-notifications}
    retry-attempts: ${APP_NOTIFICATION_RETRY_ATTEMPTS:3}
    retry-backoff: ${APP_NOTIFICATION_RETRY_BACKOFF:1s}
  interest:
    savings-annual-rate: ${APP_INTEREST_SAVINGS_ANNUAL_RATE:0.0350}
    accrual-cron: ${APP_INTEREST_ACCRUAL_CRON:0 30 0 * * *}
  security:
    jwt:
      issuer: ${APP_SECURITY_JWT_ISSUER:core-banking-ledger}
      access-token-ttl: ${APP_SECURITY_JWT_ACCESS_TOKEN_TTL:15m}
      private-key: ${APP_SECURITY_JWT_PRIVATE_KEY:}
      public-key: ${APP_SECURITY_JWT_PUBLIC_KEY:}
    rate-limit:
      transfers-per-minute: ${APP_SECURITY_RATE_LIMIT_TRANSFERS_PER_MINUTE:20}
